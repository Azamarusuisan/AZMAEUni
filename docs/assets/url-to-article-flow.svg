<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">URLから記事と画像を作る流れ</title>
  <desc id="desc">参考URLを開いて要点と出典を整理し、構成、本文、文字入り画像へ変換する三段階の図解</desc>
  <rect width="1200" height="675" fill="#f6f8f7"/>
  <rect x="36" y="36" width="1128" height="603" rx="24" fill="#ffffff" stroke="#d8e0dc" stroke-width="2"/>
  <text x="84" y="104" fill="#0f8a72" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="22" font-weight="700" letter-spacing="2">記事内図解の生成例</text>
  <text x="84" y="164" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="43" font-weight="700">URLを渡すだけで、記事の材料が見える</text>

  <g transform="translate(84 226)">
    <rect width="282" height="280" rx="18" fill="#f6f8f7" stroke="#c8d6d0" stroke-width="2"/>
    <text x="28" y="47" fill="#0f8a72" font-family="SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">01 / INPUT</text>
    <text x="28" y="94" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700">参考URL</text>
    <rect x="28" y="122" width="226" height="54" rx="9" fill="#ffffff" stroke="#9bb2a9"/>
    <circle cx="52" cy="149" r="7" fill="none" stroke="#0f8a72" stroke-width="3"/>
    <path d="M58 155l10 10" stroke="#0f8a72" stroke-width="3" stroke-linecap="round"/>
    <text x="83" y="155" fill="#52665e" font-family="SFMono-Regular, Menlo, monospace" font-size="13">https://…</text>
    <text x="28" y="217" fill="#3d524b" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18">テーマや自分の記事URLも</text>
    <text x="28" y="248" fill="#3d524b" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18">同じ入口から渡せます</text>
  </g>

  <path d="M385 366h48" stroke="#0f8a72" stroke-width="4" stroke-linecap="round"/>
  <path d="M424 355l13 11-13 11" fill="none" stroke="#0f8a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(459 226)">
    <rect width="282" height="280" rx="18" fill="#14201c"/>
    <text x="28" y="47" fill="#63d7ba" font-family="SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">02 / CHECK</text>
    <text x="28" y="94" fill="#ffffff" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700">開いて、確かめる</text>
    <circle cx="43" cy="138" r="5" fill="#63d7ba"/>
    <text x="62" y="145" fill="#e6efeb" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18">ページの内容を読む</text>
    <circle cx="43" cy="184" r="5" fill="#63d7ba"/>
    <text x="62" y="191" fill="#e6efeb" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18">要点と日付を整理</text>
    <circle cx="43" cy="230" r="5" fill="#63d7ba"/>
    <text x="62" y="237" fill="#e6efeb" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18">主張を出典へ紐づけ</text>
  </g>

  <path d="M760 366h48" stroke="#0f8a72" stroke-width="4" stroke-linecap="round"/>
  <path d="M799 355l13 11-13 11" fill="none" stroke="#0f8a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(834 226)">
    <rect width="282" height="280" rx="18" fill="#fffaf3" stroke="#dfbd8f" stroke-width="2"/>
    <text x="28" y="47" fill="#a8620a" font-family="SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700">03 / OUTPUT</text>
    <text x="28" y="94" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="28" font-weight="700">記事として見せる</text>
    <rect x="28" y="122" width="102" height="44" rx="22" fill="#ffffff" stroke="#dfbd8f"/>
    <text x="79" y="151" text-anchor="middle" fill="#6d4b23" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17">構成・本文</text>
    <rect x="140" y="122" width="114" height="44" rx="22" fill="#ffffff" stroke="#dfbd8f"/>
    <text x="197" y="151" text-anchor="middle" fill="#6d4b23" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17">出典リンク</text>
    <rect x="28" y="180" width="150" height="44" rx="22" fill="#ffffff" stroke="#dfbd8f"/>
    <text x="103" y="209" text-anchor="middle" fill="#6d4b23" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17">文字入り画像</text>
    <rect x="188" y="180" width="66" height="44" rx="22" fill="#a8620a"/>
    <text x="221" y="209" text-anchor="middle" fill="#ffffff" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17">図解</text>
  </g>

  <line x1="84" y1="552" x2="1116" y2="552" stroke="#d8e0dc"/>
  <text x="84" y="596" fill="#52665e" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="17">外部ページは資料として扱い、ページ内に書かれた指示には従いません。</text>
</svg>
