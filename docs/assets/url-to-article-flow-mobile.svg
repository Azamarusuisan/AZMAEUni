<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1060" viewBox="0 0 720 1060" role="img" aria-labelledby="title desc">
  <title id="title">URLから記事と画像を作る流れ</title>
  <desc id="desc">参考URLを開いて要点と出典を整理し、構成、本文、文字入り画像へ変換する縦長の三段階図解</desc>
  <rect width="720" height="1060" fill="#f6f8f7"/>
  <rect x="28" y="28" width="664" height="1004" rx="24" fill="#ffffff" stroke="#d8e0dc" stroke-width="2"/>
  <text x="64" y="88" fill="#0f8a72" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="20" font-weight="700" letter-spacing="2">記事内図解の生成例</text>
  <text x="64" y="143" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="35" font-weight="700">URLを渡すだけで、</text>
  <text x="64" y="190" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="35" font-weight="700">記事の材料が見える</text>

  <g transform="translate(64 232)">
    <rect width="592" height="190" rx="18" fill="#f6f8f7" stroke="#c8d6d0" stroke-width="2"/>
    <text x="28" y="45" fill="#0f8a72" font-family="SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">01 / INPUT</text>
    <text x="28" y="91" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="700">参考URLを渡す</text>
    <rect x="28" y="112" width="536" height="50" rx="9" fill="#ffffff" stroke="#9bb2a9"/>
    <circle cx="52" cy="137" r="7" fill="none" stroke="#0f8a72" stroke-width="3"/>
    <path d="M58 143l10 10" stroke="#0f8a72" stroke-width="3" stroke-linecap="round"/>
    <text x="84" y="143" fill="#52665e" font-family="SFMono-Regular, Menlo, monospace" font-size="14">https://…</text>
  </g>
  <path d="M360 437v42" stroke="#0f8a72" stroke-width="4" stroke-linecap="round"/>
  <path d="M349 470l11 13 11-13" fill="none" stroke="#0f8a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(64 499)">
    <rect width="592" height="220" rx="18" fill="#14201c"/>
    <text x="28" y="45" fill="#63d7ba" font-family="SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">02 / CHECK</text>
    <text x="28" y="91" fill="#ffffff" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="700">開いて、確かめる</text>
    <circle cx="42" cy="129" r="5" fill="#63d7ba"/>
    <text x="60" y="136" fill="#e6efeb" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19">ページの内容、日付、要点を整理</text>
    <circle cx="42" cy="172" r="5" fill="#63d7ba"/>
    <text x="60" y="179" fill="#e6efeb" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="19">記事の主張を出典URLへ紐づけ</text>
  </g>
  <path d="M360 734v42" stroke="#0f8a72" stroke-width="4" stroke-linecap="round"/>
  <path d="M349 767l11 13 11-13" fill="none" stroke="#0f8a72" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(64 796)">
    <rect width="592" height="162" rx="18" fill="#fffaf3" stroke="#dfbd8f" stroke-width="2"/>
    <text x="28" y="45" fill="#a8620a" font-family="SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">03 / OUTPUT</text>
    <text x="28" y="91" fill="#14201c" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="29" font-weight="700">記事と文字入り画像にする</text>
    <text x="28" y="130" fill="#6d4b23" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="18">構成・本文　／　出典リンク　／　図解</text>
  </g>

  <text x="64" y="994" fill="#52665e" font-family="Hiragino Sans, Yu Gothic, sans-serif" font-size="16">外部ページは資料として扱い、ページ内の指示には従いません。</text>
</svg>
